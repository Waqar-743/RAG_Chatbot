name: Deploy Backend to Render

on:
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - "rag/**"
      - "config/**"
      - "main.py"
      - "requirements.txt"
      - "requirements-full.txt"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "render-backend-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment:
      name: backend
      url: ${{ secrets.RENDER_SERVICE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deploy
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render deploy hook response: $HTTP"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ] && [ "$HTTP" != "202" ]; then
            echo "Deploy hook returned unexpected status: $HTTP"
            exit 1
          fi

      - name: Wait for Render to start building (60s)
        run: sleep 60

      - name: Smoke test — wait until backend is healthy
        run: |
          echo "Polling ${{ secrets.RENDER_SERVICE_URL }}/api/v1/health ..."
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "${{ secrets.RENDER_SERVICE_URL }}/api/v1/health" || echo "000")
            echo "Attempt $i/15: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 30
          done
          echo "ERROR: Backend did not become healthy after ~8 minutes."
          exit 1

      - name: Print deployed URLs
        run: |
          echo "Backend:      ${{ secrets.RENDER_SERVICE_URL }}"
          echo "Health check: ${{ secrets.RENDER_SERVICE_URL }}/api/v1/health"
          echo "API docs:     ${{ secrets.RENDER_SERVICE_URL }}/docs"
