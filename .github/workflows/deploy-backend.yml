name: Deploy Backend to Vercel

on:
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - "rag/**"
      - "config/**"
      - "main.py"
      - "requirements.txt"
      - "vercel.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "vercel-backend-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment:
      name: backend
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}

      - name: Smoke test health endpoint
        run: |
          echo "Testing ${{ steps.deploy.outputs.url }}/api/v1/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ steps.deploy.outputs.url }}/api/v1/health")
          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed — got HTTP $STATUS"
            exit 1
          fi
          echo "Backend is healthy."

      - name: Print deployed URLs
        run: |
          echo "Backend:      ${{ steps.deploy.outputs.url }}"
          echo "Health check: ${{ steps.deploy.outputs.url }}/api/v1/health"
          echo "API docs:     ${{ steps.deploy.outputs.url }}/docs"
