# ============================================================
# Render Blueprint — one-click deploy of the FastAPI backend.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. Go to https://dashboard.render.com → New → Blueprint
#      and connect this repo. Render auto-detects render.yaml.
#   3. Fill in the four secrets prompted (see sync: false below).
#   4. After deploy, copy the service URL (e.g. https://rag-chatbot-api.onrender.com)
#      and add it as VITE_API_URL secret in your GitHub repo settings.
#
# Free Qdrant Cloud:  https://cloud.qdrant.io  (1 GB free)
# Free MongoDB Atlas: https://cloud.mongodb.com (M0 cluster, 512 MB free)
# OpenRouter API key: https://openrouter.ai/keys
# ============================================================

services:
  - type: web
    name: rag-chatbot-api
    runtime: docker
    plan: free                      # bump to "starter" for always-on
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # OpenRouter — drives both LLM and embeddings
      - key: OPENROUTER_API_KEY
        sync: false                 # prompted on deploy, never logged
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: deepseek/deepseek-chat
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small

      # Qdrant Cloud (vector store)
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: rag_documents

      # MongoDB Atlas (chat history / metadata)
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: rag_db

      # RAG tuning defaults
      - key: TOP_K
        value: "5"
      - key: SIMILARITY_THRESHOLD
        value: "0.3"
      - key: CHUNK_SIZE
        value: "512"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: TEMPERATURE
        value: "0.7"
      - key: MAX_TOKENS
        value: "2048"
