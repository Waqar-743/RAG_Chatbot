services:
  - type: web
    name: rag-chatbot-api-waqar
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://rag-chatbot-waqar.onrender.com

      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: deepseek/deepseek-chat
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small

      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: rag_documents

      # MongoDB is optional. Add MONGO_URI in the Render dashboard to persist
      # chat history and metadata; Qdrant indexing/query works without it.
      - key: MONGO_DB_NAME
        value: rag_db

      - key: TOP_K
        value: "5"
      - key: SIMILARITY_THRESHOLD
        value: "0.3"
      - key: CHUNK_SIZE
        value: "512"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: TEMPERATURE
        value: "0.7"
      - key: MAX_TOKENS
        value: "2048"

  - type: web
    name: rag-chatbot-waqar
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        value: https://rag-chatbot-api-waqar.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
